<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S31 DVP 카메라</title>
<style>
  :root {
    --bg: #0f1216; --panel: #181c22; --line: #2a3039; --text: #e6e9ee;
    --muted: #8b95a3; --accent: #3d8bfd; --ok: #2fbf71; --warn: #f0a020; --bad: #e5484d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
           padding: 12px 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  .pill { padding: 2px 10px; border-radius: 999px; background: var(--panel);
          border: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  .pill.ok { color: var(--ok); border-color: #1f5d3b; }
  .pill.bad { color: var(--bad); border-color: #6b2326; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px;
         padding: 16px; max-width: 1400px; margin: 0 auto; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .card h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0;
             padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .viewer { position: relative; background: #000; border-radius: 10px 10px 0 0;
            aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .viewer img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .viewer .msg { position: absolute; color: var(--muted); text-align: center; padding: 16px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 14px; }
  button { background: #222832; color: var(--text); border: 1px solid var(--line);
           border-radius: 7px; padding: 7px 14px; font: inherit; cursor: pointer; }
  button:hover { border-color: #3a4350; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .side { display: flex; flex-direction: column; gap: 16px; }
  .ctl { padding: 8px 14px 14px; }
  .row { display: grid; grid-template-columns: 96px 1fr 34px; align-items: center; gap: 8px; margin-top: 8px; }
  .row label { color: var(--muted); }
  .row output { text-align: right; font-variant-numeric: tabular-nums; }
  .row select { grid-column: 2 / 4; background: #222832; color: var(--text);
                border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; font: inherit; }
  .row input[type=range] { width: 100%; accent-color: var(--accent); }
  .row input[type=checkbox] { justify-self: start; width: 18px; height: 18px; accent-color: var(--accent); }
  dl { margin: 0; padding: 8px 14px 14px; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; }
  dt { color: var(--muted); }
  dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
           background: #2a1416; border: 1px solid #6b2326; color: #ffb4b6;
           padding: 8px 14px; border-radius: 8px; display: none; }
</style>
</head>
<body>
<header>
  <h1>ESP32-S31 DVP 카메라</h1>
  <span id="pillCam" class="pill">카메라 확인 중</span>
  <span id="pillFmt" class="pill">-</span>
  <span id="pillFps" class="pill">- fps</span>
</header>

<main>
  <section class="card">
    <div class="viewer">
      <img id="view" alt="카메라 영상">
      <div id="msg" class="msg">스트림을 시작하려면 [스트림 시작]을 누르세요.</div>
    </div>
    <div class="toolbar">
      <button id="btnStream" class="primary">스트림 시작</button>
      <button id="btnCapture">사진 저장</button>
      <button id="btnOpen">새 창에서 열기</button>
    </div>
  </section>

  <aside class="side">
    <section class="card">
      <h2>센서 설정</h2>
      <div id="controls" class="ctl"></div>
    </section>
    <section class="card">
      <h2>상태</h2>
      <dl>
        <dt>센서</dt><dd id="sSensor">-</dd>
        <dt>해상도</dt><dd id="sRes">-</dd>
        <dt>JPEG 압축</dt><dd id="sEnc">-</dd>
        <dt>프레임 속도</dt><dd id="sFps">-</dd>
        <dt>JPEG 크기</dt><dd id="sJpeg">-</dd>
        <dt>수신 / 버림 / 오류</dt><dd id="sFrames">-</dd>
        <dt>스트림 접속</dt><dd id="sClients">-</dd>
        <dt>Wi-Fi</dt><dd id="sWifi">-</dd>
        <dt>남은 메모리</dt><dd id="sHeap">-</dd>
        <dt>가동 시간</dt><dd id="sUptime">-</dd>
      </dl>
    </section>
  </aside>
</main>
<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const view = $('view'), msg = $('msg'), btnStream = $('btnStream');
let streaming = false, retryTimer = null, controlsBuilt = false, resSwitching = false;
let streamStartedAt = 0, lastUptime = null;

// 센서 파라미터: 슬라이더 또는 선택 목록
const PARAMS = [
  { key: 'quality', label: 'JPEG 품질' },
  { key: 'ae_level', label: '노출 목표' },
  { key: 'contrast', label: '대비' },
  { key: 'saturation', label: '채도' },
  { key: 'special_effect', label: '특수 효과',
    options: ['없음', '네거티브', '흑백', '붉은 톤', '녹색 톤', '푸른 톤', '세피아'] },
  { key: 'wb_mode', label: '화이트 밸런스', options: ['자동', '맑음', '흐림', '사무실', '실내'] },
  { key: 'hmirror', label: '좌우 반전', toggle: true },
  { key: 'vflip', label: '상하 반전', toggle: true },
];

function toast(text) {
  const t = $('toast');
  t.textContent = text;
  t.style.display = 'block';
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.style.display = 'none'; }, 3000);
}

function startStream() {
  clearTimeout(retryTimer);
  streaming = true;
  streamStartedAt = Date.now();
  btnStream.textContent = '스트림 정지';
  msg.textContent = '연결 중...';
  msg.style.display = 'block';
  view.src = '/stream?t=' + Date.now();
}

function stopStream() {
  clearTimeout(retryTimer);
  streaming = false;
  btnStream.textContent = '스트림 시작';
  view.src = 'data:,';
  msg.textContent = '스트림을 멈췄습니다.';
  msg.style.display = 'block';
}

view.onload = () => { if (streaming) msg.style.display = 'none'; };
view.onerror = () => {
  if (!streaming) return;
  msg.textContent = '스트림이 끊겼습니다. 3초 뒤 다시 연결합니다.';
  msg.style.display = 'block';
  retryTimer = setTimeout(startStream, 3000);
};

btnStream.onclick = () => (streaming ? stopStream() : startStream());
$('btnOpen').onclick = () => window.open('/stream', '_blank');
$('btnCapture').onclick = async () => {
  try {
    const r = await fetch('/capture?t=' + Date.now());
    if (!r.ok) throw new Error(await r.text());
    const url = URL.createObjectURL(await r.blob());
    const d = new Date(), p = (n) => String(n).padStart(2, '0');
    const a = document.createElement('a');
    a.href = url;
    a.download = `capture_${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_` +
                 `${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.jpg`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch (e) {
    toast('사진을 받지 못했습니다: ' + e.message);
  }
};

async function setParam(key, val) {
  try {
    const r = await fetch(`/control?var=${key}&val=${val}`);
    if (!r.ok) throw new Error(await r.text());
  } catch (e) {
    toast(`설정 실패 (${key}): ${e.message}`);
  }
}

// 해상도 전환은 보드에서 약 1초 걸린다. 스트림은 끊기지 않고 새 해상도로 이어진다.
async function setResolution(val) {
  const sel = $('selRes');
  resSwitching = true;
  sel.disabled = true;
  try {
    const r = await fetch(`/control?var=resolution&val=${val}`);
    if (!r.ok) throw new Error(await r.text());
  } catch (e) {
    toast('해상도 변경 실패: ' + e.message);
  } finally {
    resSwitching = false;
    sel.disabled = false;
    pollStatus();
  }
}

function buildControls(params, resolutions, current) {
  const box = $('controls');
  box.innerHTML = '';
  if (resolutions && resolutions.length) {
    const row = document.createElement('div');
    row.className = 'row';
    const label = document.createElement('label');
    label.textContent = '해상도';
    const sel = document.createElement('select');
    sel.id = 'selRes';
    for (const r of resolutions) {
      const o = document.createElement('option');
      o.value = `${r.width}x${r.height}`;
      o.textContent = `${r.width}×${r.height} (${r.fps} fps)`;
      sel.appendChild(o);
    }
    sel.value = current;
    sel.onchange = () => setResolution(sel.value);
    row.append(label, sel);
    box.appendChild(row);
  }
  for (const p of PARAMS) {
    const info = params[p.key];
    if (!info) continue;
    const row = document.createElement('div');
    row.className = 'row';
    const label = document.createElement('label');
    label.textContent = p.label;
    row.appendChild(label);
    if (p.toggle) {
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = info.value === 1;
      cb.onchange = () => setParam(p.key, cb.checked ? 1 : 0);
      row.appendChild(cb);
    } else if (p.options) {
      const sel = document.createElement('select');
      for (let v = info.min; v <= info.max; v++) {
        const o = document.createElement('option');
        o.value = v;
        o.textContent = p.options[v] ?? v;
        sel.appendChild(o);
      }
      sel.value = info.value;
      sel.onchange = () => setParam(p.key, sel.value);
      row.appendChild(sel);
    } else {
      const range = document.createElement('input');
      range.type = 'range';
      range.min = info.min;
      range.max = info.max;
      range.value = info.value;
      const out = document.createElement('output');
      out.textContent = info.value;
      range.oninput = () => { out.textContent = range.value; };
      range.onchange = () => setParam(p.key, range.value);
      row.append(range, out);
    }
    box.appendChild(row);
  }
  if (!box.children.length) box.textContent = '설정할 수 있는 항목이 없습니다.';
}

function fmtBytes(n) {
  return n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : (n / 1024).toFixed(1) + ' KB';
}

function fmtUptime(s) {
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return `${h}시간 ${m}분 ${s % 60}초`;
}

async function pollStatus() {
  try {
    const r = await fetch('/status', { cache: 'no-store' });
    const s = await r.json();
    const c = s.camera;
    $('pillCam').textContent = c.running ? `${c.sensor} 동작 중` : '카메라 오류';
    $('pillCam').className = 'pill ' + (c.running ? 'ok' : 'bad');
    $('pillFmt').textContent = `${c.width}×${c.height} JPEG`;
    $('pillFps').textContent = `${c.fps.toFixed(1)} fps`;
    $('sSensor').textContent = c.sensor;
    $('sRes').textContent = `${c.width} × ${c.height}`;
    $('sEnc').textContent = c.jpeg_source === 'hw' ? 'S31 하드웨어 인코더' : (c.jpeg_source === 'sensor' ? '센서 내장' : '-');
    $('sFps').textContent = `${c.fps.toFixed(1)} fps` + (c.sensor_fps ? ` (센서 ${c.sensor_fps})` : '');
    $('sJpeg').textContent = fmtBytes(c.jpeg_size);
    $('sFrames').textContent = `${c.frames} / ${c.dropped} / ${c.bad}`;
    $('sClients').textContent = `${s.stream_clients} / ${s.max_stream_clients}`;
    $('sWifi').textContent = `${s.wifi.ip} (${s.wifi.rssi} dBm)`;
    $('sHeap').textContent = `내부 ${fmtBytes(s.heap.internal)}, PSRAM ${fmtBytes(s.heap.psram)}`;
    $('sUptime').textContent = fmtUptime(s.uptime_s);
    // MJPEG 연결이 도중에 끊기면 브라우저가 img 오류를 알리지 않아 화면이 멈춘다.
    // 보드가 재부팅했거나(가동 시간이 줄어듦) 스트림 접속이 0이면 다시 연결한다.
    const rebooted = lastUptime !== null && s.uptime_s < lastUptime;
    lastUptime = s.uptime_s;
    if (streaming && (rebooted || (s.stream_clients === 0 && Date.now() - streamStartedAt > 5000))) {
      startStream();
    }
    const cur = `${c.width}x${c.height}`;
    if (!controlsBuilt) { buildControls(s.params, s.resolutions, cur); controlsBuilt = true; }
    const sel = $('selRes');
    if (sel && !resSwitching && document.activeElement !== sel) sel.value = cur;
    document.querySelector('.viewer').style.aspectRatio = `${c.width} / ${c.height}`;
  } catch (e) {
    $('pillCam').textContent = '보드 연결 끊김';
    $('pillCam').className = 'pill bad';
  }
}

pollStatus();
setInterval(pollStatus, 2000);
startStream();
</script>
</body>
</html>
